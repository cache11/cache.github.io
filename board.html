<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Dashboard</title>
</head>
<body>
    
    <div class="container">
        <div class="box-1">
            <h1>Books</h1>
            <p id="totalBooks">0</p>
        </div>
        <div class="box-2">
            <h1>Borrowed</h1>
            <p id="borrowedBooks">0</p>
        </div>
        <div class="box-3">
            <h1>Returned</h1>
            <p id="returnedBooks">0</p>
        </div>
        <div class="box-4">
            <h1>Waiting</h1>
            <ul id="waitingQueueList">0</ul>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
